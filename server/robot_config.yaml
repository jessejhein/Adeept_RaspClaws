# RaspClaws robot configuration (auto-saved).
# min/max: integer stop, or null for no software stop.
# Even leg ports = shoulder; odd = knee. Hand comments in motors may be replaced on save.
# channel_swaps: pairs of logical HAT ports that were plugged into each other.

meta:
  name: raspclaws
  pwm_freq_hz: 50
  angle_range_deg: 180
  ctrl_range_min: 100
  ctrl_range_max: 560
  channel_swaps:
    - [10, 11]
leds:
  count: 10
  pin_bcm: 12
  brightness: 128
camera:
  pan_channel: 12
  tilt_channel: 13
  invert_pan: false
  invert_tilt: false
motors:
  - id: 0
    name: front_left_shoulder
    center: 280
    min: 80
    max: 540
    invert: false
    enabled: true
